<script>(function(){function boot(){var menu=document.getElementById('mobileMenu'),sidebar=document.querySelector('.sidebar'),overlay=document.getElementById('mobileOverlay');if(!menu||!sidebar)return;function mobile(){return window.innerWidth<=720}function closeMenu(){sidebar.classList.remove('open');if(overlay)overlay.classList.remove('open');document.body.classList.remove('menu-open');menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open menu')}function openMenu(){if(!mobile())return;sidebar.classList.add('open');if(overlay)overlay.classList.add('open');document.body.classList.add('menu-open');menu.setAttribute('aria-expanded','true');menu.setAttribute('aria-label','Close menu')}menu.onclick=function(e){e.preventDefault();e.stopPropagation();sidebar.classList.contains('open')?closeMenu():openMenu()};menu.ontouchend=function(e){e.preventDefault();e.stopPropagation();sidebar.classList.contains('open')?closeMenu():openMenu()};if(overlay)overlay.onclick=closeMenu;if(overlay)overlay.ontouchend=function(e){e.preventDefault();closeMenu()};document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.sidebar .nav-item'))closeMenu()},true);document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});window.addEventListener('resize',function(){if(!mobile())closeMenu()})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot()} )();</script>
<script>(function(){function caseFromRow(row){var s=window.P1&&P1.state?P1.state():null;if(!s||!row)return null;var cell=row.querySelector('td');var n=(cell?.innerText||'').split('\n')[0].trim();return (s.cases||[]).find(function(c){return String(c.number)===n})||null}function paymentIndex(row){var s=P1.state(),cells=row.querySelectorAll('td'),number=(cells[1]?.innerText||'').split('\n')[0].trim(),amount=(cells[3]?.innerText||'').replace(/[^0-9.]/g,''),date=(cells[0]?.innerText||'').trim();var arr=s.feePayments.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});var p=arr.find(function(x){var c=(s.cases||[]).find(function(z){return String(z.id)===String(x.caseId)});return String(c?.number||x.caseNumber||'')===number&&P1.date(x.date)===date&&String(Number(x.amount))===String(Number(amount))});return p?s.feePayments.findIndex(function(x){return x.id===p.id}):-1}function additionalIndex(row){var s=P1.state(),cells=row.querySelectorAll('td'),number=(cells[1]?.innerText||'').split('\n')[0].trim(),amount=(cells[5]?.innerText||'').replace(/[^0-9.]/g,''),date=(cells[0]?.innerText||'').trim();var arr=s.additionalChargeTransactions.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});var x=arr.find(function(z){return String(z.caseNumber||'')===number&&P1.date(z.date)===date&&String(Number(z.amount))===String(Number(amount))});return x?s.additionalChargeTransactions.findIndex(function(y){return y.id===x.id}):-1}function runAction(b,row,id,text){if(id==='p1feerows'&&text==='Fee Setup'){var c=caseFromRow(row);if(c&&typeof window.p1FeeSetup==='function'){window.p1FeeSetup(c.id);return true}}if(id==='p1feerows'&&text==='＋ Payment'){var c=caseFromRow(row);if(c&&typeof window.p1TransactionModal==='function'){window.p1TransactionModal('payment',c.id);return true}}if(id==='p1feepayrows'&&text==='Edit'){var i=paymentIndex(row);if(i>=0&&typeof window.p1TransactionModal==='function'){window.p1TransactionModal('payment',P1.state().feePayments[i].caseId,i);return true}}if(id==='p1additionalrows'&&text==='Edit'){var i=additionalIndex(row);if(i>=0&&typeof window.p1TransactionModal==='function'){window.p1TransactionModal('additional',P1.state().additionalChargeTransactions[i].caseId,i);return true}}return false}document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button'),row=b&&b.closest('tr');if(!b||!row)return;var id=row.parentElement&&row.parentElement.id,text=(b.innerText||'').trim();if(runAction(b,row,id,text)){e.preventDefault();e.stopImmediatePropagation()}},true);document.addEventListener('pointerup',function(e){var b=e.target.closest&&e.target.closest('button'),row=b&&b.closest('tr');if(!b||!row)return;var id=row.parentElement&&row.parentElement.id,text=(b.innerText||'').trim();if(runAction(b,row,id,text)){e.preventDefault();e.stopPropagation()}},true)})();</script>
<script>(function(){function addCaseFeeButton(){var content=document.getElementById('content');if(!content)return;var finance=content.querySelector('#p1feerows');if(!finance)return;if(content.querySelector('[data-finance-add-case-fee]'))return;var buttons=Array.prototype.slice.call(content.querySelectorAll('button'));var addTx=buttons.find(function(b){return (b.innerText||'').trim()==='＋ Add Transaction'});if(!addTx)return;var b=document.createElement('button');b.type='button';b.className=addTx.className;b.setAttribute('data-finance-add-case-fee','1');b.textContent='＋ Add Case Fee';b.onclick=function(e){e.preventDefault();e.stopPropagation();if(typeof window.p1FeeSetup==='function')window.p1FeeSetup()};addTx.insertAdjacentElement('afterend',b)}var observer=new MutationObserver(function(){addCaseFeeButton()});function start(){var c=document.getElementById('content');if(!c)return;observer.observe(c,{childList:true,subtree:true});addCaseFeeButton()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start()})();</script></body></html>
