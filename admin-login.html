<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Admin Login — AdvocateDesk</title><link rel="stylesheet" href="styles.css"></head><body class="login-page portal-login-page admin-login"><div class="login-card"><a class="back-login" href="login.html">← Back to portal selection</a><div class="login-brand"><div class="brand-mark">🛡️</div><div><strong>AdvocateDesk</strong><small>Admin Portal</small></div></div><h1>Admin Login</h1><p class="login-subtitle">Sign in to your authorized law office workspace.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="login-submit" type="submit">Sign in as Admin</button><div id="error" class="login-error" role="alert"></div></form><p style="margin:12px 0;text-align:center"><button type="button" id="forgotPassword" class="back-login" style="border:0;background:none;cursor:pointer">Forgot password?</button></p><p class="login-subtitle">Use the email and password registered in your AdvocateDesk account.</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20261009-admin-recovery-guard"></script><script>document.getElementById('forgotPassword').addEventListener('click',async function(){var email=document.getElementById('email').value.trim(),err=document.getElementById('error'),b=this;if(!email){err.textContent='Enter your account email address first.';document.getElementById('email').focus();return;}b.disabled=true;err.textContent='Sending password recovery email...';try{var result=await ADAuth.client().functions.invoke("advocatedesk-admin-recovery",{body:{email:email}});if(result.error)throw result.error;err.textContent=(result.data&&result.data.message)||"If this email belongs to an active office administrator, a password reset link will be sent.";}catch(x){err.textContent="Recovery service is temporarily unavailable. Please try again later.";console.error("Admin recovery request failed:",x);}finally{b.disabled=false;}});document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();var b=this.querySelector('button[type=submit]'),err=document.getElementById('error');b.disabled=true;b.textContent='Verifying...';err.textContent='';try{await ADAuth.signIn(document.getElementById('email').value,document.getElementById('password').value,'admin');location.replace('app.html?portal=admin#dashboard')}catch(x){err.textContent=x&&x.message?x.message:'Sign-in failed. Please try again.'}finally{b.disabled=false;b.textContent='Sign in as Admin'}});</script></body></html>
