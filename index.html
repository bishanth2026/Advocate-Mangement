<script>(function(){function toggleMenu(){var sidebar=document.querySelector('.sidebar'),overlay=document.getElementById('mobileOverlay');if(!sidebar)return;var open=!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);if(overlay){overlay.classList.toggle('open',open);overlay.setAttribute('aria-hidden',open?'false':'true');}document.body.classList.toggle('menu-open',open);var btn=document.getElementById('mobileMenu');if(btn)btn.setAttribute('aria-expanded',String(open));}document.addEventListener('click',function(e){var btn=e.target.closest&&e.target.closest('#mobileMenu');if(btn){e.preventDefault();e.stopImmediatePropagation();toggleMenu();return;}var nav=e.target.closest&&e.target.closest('.sidebar .nav-item');if(nav&&window.innerWidth<=720){setTimeout(function(){var sidebar=document.querySelector('.sidebar'),overlay=document.getElementById('mobileOverlay');if(sidebar)sidebar.classList.remove('open');if(overlay){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');}document.body.classList.remove('menu-open');},50);}},true);})();</script>
