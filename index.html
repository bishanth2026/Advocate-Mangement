<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>AdvocateDesk — Practice Management</title>
<link rel="stylesheet" href="styles.css?v=20260907">
<link rel="stylesheet" href="action-fix.css?v=20260907b">
<style>
@media (max-width:720px){
  .mobile-menu{display:flex!important;align-items:center;justify-content:center;width:44px;height:44px;min-width:44px;padding:0!important;position:relative;z-index:100!important;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .sidebar{transform:translate3d(-100%,0,0)!important;visibility:hidden;pointer-events:none;transition:transform .22s ease,visibility 0s linear .22s!important;z-index:1000!important;}
  .sidebar.open{transform:translate3d(0,0,0)!important;visibility:visible;pointer-events:auto;transition:transform .22s ease!important;}
  .mobile-overlay{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;visibility:hidden;pointer-events:none;z-index:900;transition:opacity .22s ease,visibility 0s linear .22s;touch-action:manipulation;}
  .mobile-overlay.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s ease;}
  body.menu-open{overflow:hidden;touch-action:none;}
  body.menu-open .sidebar{touch-action:auto;}
}
@media (min-width:721px){.mobile-overlay{display:none!important}.mobile-menu{display:none!important}}

/* Client Management: phone layout is card-based, never squeezed horizontally. */
@media(max-width:720px){
  body{overflow-x:hidden!important;}
  .topbar{background:#fff!important;opacity:1!important;z-index:100!important;}
  #content > .grid-2 + .grid-2{
    display:grid!important;
    grid-template-columns:minmax(0,1fr)!important;
    gap:12px!important;
    width:100%!important;
    min-width:0!important;
    margin-top:12px!important;
  }
  #content > .grid-2 + .grid-2 > .panel{
    width:100%!important;
    min-width:0!important;
    max-width:100%!important;
    overflow:hidden!important;
  }
  #content > .grid-2 + .grid-2 .list{
    width:100%!important;
    min-width:0!important;
  }
  #content > .grid-2 + .grid-2 .list-row{
    width:100%!important;
    min-width:0!important;
    max-width:100%!important;
    display:grid!important;
    grid-template-columns:48px minmax(0,1fr)!important;
    align-items:start!important;
    gap:10px!important;
    padding:14px 13px!important;
    overflow:hidden!important;
  }
  #content > .grid-2 + .grid-2 .date-box{
    width:43px!important;
    min-width:43px!important;
    flex:none!important;
  }
  #content > .grid-2 + .grid-2 .list-main{
    width:auto!important;
    min-width:0!important;
    max-width:none!important;
    overflow:hidden!important;
  }
  #content > .grid-2 + .grid-2 .list-main strong,
  #content > .grid-2 + .grid-2 .list-main small{
    display:block!important;
    width:100%!important;
    max-width:100%!important;
    overflow-wrap:anywhere!important;
    word-break:normal!important;
    white-space:normal!important;
  }
  #content > .grid-2 + .grid-2 .list-row > div:last-child{
    grid-column:1/-1!important;
    width:100%!important;
    min-width:0!important;
    max-width:100%!important;
    display:flex!important;
    justify-content:flex-end!important;
    align-items:center!important;
    flex-wrap:wrap!important;
    gap:7px!important;
    margin-top:4px!important;
  }
  #content > .grid-2 + .grid-2 .list-row > div:last-child .secondary{
    width:auto!important;
    min-width:76px!important;
    flex:0 0 auto!important;
    white-space:nowrap!important;
    min-height:40px!important;
  }
  #content > .grid-2 + .grid-2 .empty{
    width:100%!important;
    padding:30px 18px!important;
    text-align:center!important;
  }
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">⚖</div><div><strong>AdvocateDesk</strong><small>Practice Management</small></div></div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">▦ <span>Dashboard</span></button>
      <button class="nav-item" data-page="cases">⚖ <span>Cases</span></button>
      <button class="nav-item" data-page="clients">♙ <span>Clients</span></button>
      <button class="nav-item" data-page="client-management">◉ <span>Client Management</span></button>
      <button class="nav-item" data-page="hearings">◷ <span>Hearings</span></button>
      <button class="nav-item" data-page="calendar">▣ <span>Calendar</span></button>
      <button class="nav-item" data-page="documents">▤ <span>Documents</span></button>
      <button class="nav-item" data-page="tasks">✓ <span>Tasks</span></button>
      <button class="nav-item" data-page="finance">₹ <span>Finance</span></button>
      <button class="nav-item" data-page="reports">▥ <span>Reports</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
      <button class="nav-item admin-only" data-page="central-control"><span class="nav-icon">⚙</span><span>Central Control</span></button>
      <div class="profile-mini"><div class="avatar">A</div><div><strong>Advocate Admin</strong><small>Demo Workspace</small></div></div>
    </div>
  </aside>
  <div class="mobile-overlay" id="mobileOverlay" aria-hidden="true"></div>
  <main class="main">
    <header class="topbar">
      <button type="button" class="mobile-menu" id="mobileMenu" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search cases, clients, hearings..."></div>
      <div class="top-actions"><button class="icon-btn" title="Notifications">♢</button><button class="user-chip">A <span>Advocate Admin</span> ▾</button></div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>
<script src="auth.js?v=20260907"></script>
<script src="app.js?v=20260907"></script>
<script src="fixes.js?v=20260907"></script>
<script>
(function(){
  function boot(){
    var menu=document.getElementById('mobileMenu');
    var sidebar=document.querySelector('.sidebar');
    var overlay=document.getElementById('mobileOverlay');
    if(!menu||!sidebar)return;
    function mobile(){return window.innerWidth<=720;}
    function closeMenu(){
      sidebar.classList.remove('open');
      if(overlay)overlay.classList.remove('open');
      document.body.classList.remove('menu-open');
      menu.setAttribute('aria-expanded','false');
      menu.setAttribute('aria-label','Open menu');
    }
    function openMenu(){
      if(!mobile())return;
      sidebar.classList.add('open');
      if(overlay)overlay.classList.add('open');
      document.body.classList.add('menu-open');
      menu.setAttribute('aria-expanded','true');
      menu.setAttribute('aria-label','Close menu');
    }
    menu.onclick=function(e){e.preventDefault();e.stopPropagation();sidebar.classList.contains('open')?closeMenu():openMenu();};
    menu.ontouchend=function(e){e.preventDefault();e.stopPropagation();sidebar.classList.contains('open')?closeMenu():openMenu();};
    if(overlay)overlay.onclick=closeMenu;
    if(overlay)overlay.ontouchend=function(e){e.preventDefault();closeMenu();};
    document.addEventListener('click',function(e){
      if(e.target.closest && e.target.closest('.sidebar .nav-item'))closeMenu();
    },true);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});
    window.addEventListener('resize',function(){if(!mobile())closeMenu();});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
</body>
</html>
